<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DawnlorD</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#9ca3af;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div id="msg">Caricamento di DawnlorD…</div>
<noscript>Per giocare serve JavaScript.</noscript>
<script>
// AVVIO DI DAWNLORD — questo file non cambia mai, quindi non importa se il browser lo tiene in cache.
// Online: scarica ogni volta l'ULTIMA pagina del gioco (mai dalla cache) e la mette al posto di questa;
// l'indirizzo resta quello di questo file (anche nei preferiti o sulla schermata Home).
// Se il download non è possibile (es. file aperto con doppio clic dal PC, dove il browser lo vieta),
// apre direttamente la pagina del gioco con un parametro sempre diverso.
(function(){
  var GAME = 'dawnlord.html';
  function direct(){ location.replace(GAME + '?v=' + Date.now()); }
  if(location.protocol === 'file:'){ direct(); return; }          // in locale (file://) fetch è vietato: via diretta
  fetch(GAME + '?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(direct);                                               // qualunque problema: via diretta
})();
</script>
</body>
</html>
